name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@v6
      - name: Install MCP runtime
        run: uv sync --frozen --project plugins/llm-wiki --python "${{ matrix.python-version }}"
      - name: Compile scripts
        run: python -m compileall plugins/llm-wiki/skills/llm-wiki/scripts plugins/llm-wiki/hooks
      - name: Run tests
        run: uv run --frozen --project plugins/llm-wiki python -m unittest discover -s tests -v

  dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: plugins/llm-wiki/dashboard/package-lock.json
      - run: npm ci --prefix plugins/llm-wiki/dashboard
      - run: npm run build --prefix plugins/llm-wiki/dashboard
      - name: Verify bundled assets match source
        run: git diff --exit-code -- plugins/llm-wiki/dashboard/dist
